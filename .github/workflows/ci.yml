name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust
        run: rustup default stable
      - name: Test CLI and analysis core
        run: cargo test --locked
      - name: Build CLI
        run: cargo build --release --locked
      - name: Upload Windows CLI
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: layersift-windows-cli
          path: target/release/layersift.exe
          if-no-files-found: error

  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust
        run: rustup default stable
      - name: Install Node packages
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Test desktop backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build ad hoc signed Mac app
        run: npm run tauri -- build --bundles app
      - name: Verify Mac app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/LayerSift.app
      - name: Package and verify Mac downloads
        run: bash scripts/package-macos.sh "$RUNNER_TEMP/layersift-release"
      - name: Upload Mac desktop downloads
        uses: actions/upload-artifact@v4
        with:
          name: layersift-mac-desktop
          path: ${{ runner.temp }}/layersift-release/*
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust
        run: rustup default stable
      - name: Install Node packages
        run: npm ci
      - name: Build and test desktop app
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Install and launch Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'LayerSiftSmoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($install.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -match 'layersift' -and $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $app) { throw "Installed LayerSift executable is missing in $installDir" }
          $process = Start-Process -FilePath $app.FullName -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "LayerSift exited shortly after launch with code $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: layersift-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
