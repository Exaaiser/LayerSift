[package]
name = "layersift"
version = "0.1.1"
edition = "2024"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
hex = "0.4"
md-5 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
